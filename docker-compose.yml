services:
  9router:
    image: mhiqrambhrng/9router-mibp-version:latest
    # Build from this checkout so `docker compose up --build` ships the local
    # source (new fork features included) instead of only the pushed :latest.
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    container_name: 9router
    restart: always
    ports:
      # Loopback only. The dashboard shares this port with the proxy API, so a
      # bare "20128:20128" publishes the dashboard to the LAN. Set
      # HOST_BIND=0.0.0.0 only behind an authenticating reverse proxy.
      - "${HOST_BIND:-127.0.0.1}:20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  9router-data:
    name: 9router-data
